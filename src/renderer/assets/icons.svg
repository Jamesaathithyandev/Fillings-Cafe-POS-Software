<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>

    <!-- POS / Cashier Register -->
    <symbol id="icon-pos" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="20" height="13" rx="2"/>
      <path d="M7 21h10M12 17v4"/>
      <path d="M7 8h2M11 8h2M15 8h2M7 12h2M11 12h2M15 12h2"/>
    </symbol>

    <!-- Dashboard / Grid Chart -->
    <symbol id="icon-dashboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1.5"/>
      <rect x="14" y="3" width="7" height="7" rx="1.5"/>
      <rect x="3" y="14" width="7" height="7" rx="1.5"/>
      <path d="M14 17.5h7M17.5 14v7" stroke-width="2.2"/>
    </symbol>

    <!-- Customers / Person -->
    <symbol id="icon-customers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="7" r="4"/>
      <path d="M1 21v-2a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v2"/>
      <circle cx="19" cy="8" r="2.5"/>
      <path d="M23 21v-1a4 4 0 0 0-2.5-3.7"/>
    </symbol>

    <!-- Menu / Fork and Knife -->
    <symbol id="icon-menu-food" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 2v7c0 1.66 1.34 3 3 3s3-1.34 3-3V2"/>
      <path d="M6 2v20"/>
      <path d="M21 15V2a5 5 0 0 0-5 5v6h5zM21 15v7"/>
    </symbol>

    <!-- Reports / Bar Chart -->
    <symbol id="icon-reports" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 3v18h18"/>
      <path d="M7 16l4-6 4 4 4-7"/>
      <circle cx="7" cy="16" r="1.5" fill="currentColor" stroke="none"/>
      <circle cx="11" cy="10" r="1.5" fill="currentColor" stroke="none"/>
      <circle cx="15" cy="14" r="1.5" fill="currentColor" stroke="none"/>
      <circle cx="19" cy="7" r="1.5" fill="currentColor" stroke="none"/>
    </symbol>

    <!-- Backup / Database -->
    <symbol id="icon-backup" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="12" cy="5" rx="9" ry="3"/>
      <path d="M3 5v4c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/>
      <path d="M3 9v4c0 1.66 4.03 3 9 3s9-1.34 9-3V9"/>
      <path d="M3 13v4c0 1.66 4.03 3 9 3s9-1.34 9-3v-4"/>
    </symbol>

    <!-- Rupee / Currency -->
    <symbol id="icon-rupee" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3h12M6 8h12M13 21 6 8M6 13h3a4 4 0 0 0 0-8"/>
    </symbol>

    <!-- Clock -->
    <symbol id="icon-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <path d="M12 6v6l4 2"/>
    </symbol>

    <!-- Cart / Shopping Bag -->
    <symbol id="icon-cart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
      <line x1="3" y1="6" x2="21" y2="6"/>
      <path d="M16 10a4 4 0 0 1-8 0"/>
    </symbol>

    <!-- Check Circle -->
    <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
      <polyline points="22 4 12 14.01 9 11.01"/>
    </symbol>

    <!-- Cash / Banknote -->
    <symbol id="icon-cash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="4" width="22" height="16" rx="2"/>
      <circle cx="12" cy="12" r="3"/>
      <path d="M1 9h4M19 9h4M1 15h4M19 15h4"/>
    </symbol>

    <!-- Mobile / UPI -->
    <symbol id="icon-upi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="2" width="14" height="20" rx="2"/>
      <line x1="12" y1="18" x2="12.01" y2="18" stroke-width="2.5"/>
      <path d="M9 7h6M9 11h6"/>
    </symbol>

    <!-- Credit Card -->
    <symbol id="icon-card" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="4" width="22" height="16" rx="2"/>
      <line x1="1" y1="10" x2="23" y2="10"/>
      <path d="M6 15h2M10 15h6"/>
    </symbol>

    <!-- Search -->
    <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </symbol>

    <!-- Close / X -->
    <symbol id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </symbol>

    <!-- Plus -->
    <symbol id="icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </symbol>

    <!-- Minus -->
    <symbol id="icon-minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <line x1="5" y1="12" x2="19" y2="12"/>
    </symbol>

    <!-- Trash -->
    <symbol id="icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="3 6 5 6 21 6"/>
      <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
      <path d="M10 11v6M14 11v6"/>
      <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
    </symbol>

    <!-- Edit / Pencil -->
    <symbol id="icon-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
      <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
    </symbol>

    <!-- Excel / Spreadsheet -->
    <symbol id="icon-excel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="8" y1="13" x2="16" y2="13"/>
      <line x1="8" y1="17" x2="16" y2="17"/>
      <line x1="10" y1="9" x2="10" y2="9"/>
    </symbol>

    <!-- Folder / Data Directory -->
    <symbol id="icon-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
    </symbol>

    <!-- Sync / Refresh -->
    <symbol id="icon-sync" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10"/>
      <polyline points="1 20 1 14 7 14"/>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
    </symbol>

    <!-- Print / Printer -->
    <symbol id="icon-print" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 6 2 18 2 18 9"/>
      <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
      <rect x="6" y="14" width="12" height="8"/>
    </symbol>

    <!-- Save / Floppy Disk -->
    <symbol id="icon-save" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
      <polyline points="17 21 17 13 7 13 7 21"/>
      <polyline points="7 3 7 8 15 8"/>
    </symbol>

    <!-- Star / Top Item -->
    <symbol id="icon-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
    </symbol>

    <!-- Chevron Right -->
    <symbol id="icon-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"/>
    </symbol>

    <!-- Toggle / Other payment -->
    <symbol id="icon-other" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <path d="M12 8v4l3 3"/>
      <path d="M8 3.5A9 9 0 0 1 21 12"/>
    </symbol>

    <!-- Restore / Download -->
    <symbol id="icon-restore" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </symbol>

    <!-- Eye / View -->
    <symbol id="icon-view" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
      <circle cx="12" cy="12" r="3"/>
    </symbol>

    <!-- Fillings Cafe Brand Logo Mark (Cup with steam) -->
    <symbol id="logo-mark" viewBox="0 0 48 48" fill="none">
      <!-- Cup Body -->
      <path d="M10 18h28l-3 18a3 3 0 0 1-3 2.5H16a3 3 0 0 1-3-2.5L10 18z" fill="url(#logo-grad-body)" stroke="none"/>
      <!-- Cup Handle -->
      <path d="M38 22h4a4 4 0 0 1 0 8h-4" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <!-- Steam lines -->
      <path d="M18 13c0-2 2-2 2-4" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
      <path d="M24 11c0-2 2-2 2-4" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
      <path d="M30 13c0-2 2-2 2-4" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
      <!-- Plate -->
      <ellipse cx="24" cy="38.5" rx="14" ry="2" fill="#D97706" opacity="0.5"/>
      <!-- Shine -->
      <path d="M15 22h6" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"/>
      <!-- Defs for gradient -->
      <defs>
        <linearGradient id="logo-grad-body" x1="10" y1="18" x2="38" y2="38.5" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#F59E0B"/>
          <stop offset="100%" stop-color="#EA580C"/>
        </linearGradient>
      </defs>
    </symbol>

    <!-- Empty Cart Illustration -->
    <symbol id="illus-empty-cart" viewBox="0 0 120 100" fill="none">
      <circle cx="60" cy="50" r="40" fill="rgba(245,158,11,0.07)"/>
      <path d="M30 35h8l6 26h32l5-18H45" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>
      <circle cx="52" cy="65" r="4" stroke="#F59E0B" stroke-width="2" fill="none" opacity="0.6"/>
      <circle cx="72" cy="65" r="4" stroke="#F59E0B" stroke-width="2" fill="none" opacity="0.6"/>
      <path d="M55 48v-8M60 46v-10M65 48v-8" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    </symbol>

    <!-- Empty State / No Data -->
    <symbol id="illus-no-data" viewBox="0 0 120 100" fill="none">
      <circle cx="60" cy="50" r="38" fill="rgba(245,158,11,0.06)"/>
      <rect x="32" y="32" width="56" height="40" rx="4" stroke="#94A3B8" stroke-width="2" fill="none" opacity="0.4"/>
      <line x1="40" y1="44" x2="80" y2="44" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
      <line x1="40" y1="52" x2="72" y2="52" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
      <line x1="40" y1="60" x2="65" y2="60" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" opacity="0.2"/>
      <circle cx="82" cy="68" r="12" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
      <line x1="78" y1="64" x2="86" y2="72" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="86" y1="64" x2="78" y2="72" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    </symbol>

  </defs>
</svg>
